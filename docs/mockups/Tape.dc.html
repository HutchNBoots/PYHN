<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tape screen</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECE9E2}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1040px; height: 480px; box-sizing: border-box; background: #121214; color: #ECE9E2; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 10px">

<div style="height: 48px; display: flex; align-items: center; gap: 14px">
<nav aria-label="Screens" style="display: flex; gap: 4px">
<a href="Main.dc.html" style="min-width: 64px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; color: #ECE9E2; font-weight: 500; font-size: 14px; text-decoration: none">Synth</a>
<a href="Main.dc.html" style="min-width: 64px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; color: #ECE9E2; font-weight: 500; font-size: 14px; text-decoration: none">Drum</a>
<a href="Sequencer.dc.html" style="min-width: 64px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; color: #ECE9E2; font-weight: 500; font-size: 14px; text-decoration: none">Seq</a>
<a href="Tape.dc.html" aria-current="page" style="min-width: 64px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #ECE9E2; color: #121214; font-weight: 700; font-size: 14px; text-decoration: none">Tape</a>
<a href="Main.dc.html" style="min-width: 64px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; color: #ECE9E2; font-weight: 500; font-size: 14px; text-decoration: none">Mixer</a>
</nav>
<button style="height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: #1C1C20; color: #ECE9E2; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 500; font-size: 14px; display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M5 4L2 7l3 3M2 7h8a4 4 0 0 1 0 8H8" fill="none" stroke="#ECE9E2" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
Undo
</button>
<button style="height: 44px; padding: 0 14px; border-radius: 10px; border: 0; background: #4F8BFF; color: #121214; font-family: 'Space Grotesk', system-ui, sans-serif; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><path d="M8 2v8M4.5 6.5L8 10l3.5-3.5M3 13h10" fill="none" stroke="#121214" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
Export WAV
</button>
<div style="flex-grow: 1"></div>
<div style="display: flex; align-items: baseline; gap: 4px; font-family: 'IBM Plex Mono', monospace">
<span style="font-size: 22px; font-weight: 500">120.0</span>
<span style="font-size: 12px; color: #A9A69F">BPM</span>
</div>
<button aria-label="Play" style="width: 48px; height: 44px; border-radius: 10px; border: 0; background: #1C1C20; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><path d="M4 2.5v13l11-6.5z" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linejoin="round"></path></svg>
</button>
<button aria-label="Record onto selected track" style="width: 48px; height: 44px; border-radius: 10px; border: 0; background: #FF6B57; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6" fill="#121214"></circle></svg>
</button>
<button onClick="{{toggleShift}}" aria-pressed="{{shiftPressed}}" style="{{shiftStyle}}">Shift</button>
</div>

<div style="height: 220px; display: flex; gap: 10px">
<div style="flex-grow: 1; border-radius: 16px; background: #1C1C20; padding: 12px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 20px; font-weight: 700">Tape</span>
<span style="font-size: 13px; color: #A9A69F">bars 1–8 looping · overdub</span>
<div style="flex-grow: 1"></div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A9A69F">{{layerLabel}}</span>
</div>
<div role="group" aria-label="Tape tracks" style="position: relative; display: flex; flex-direction: column; gap: 6px; flex-grow: 1">
<sc-for list="{{tracks}}" as="t" hint-placeholder-count="4">
<button onClick="{{t.pick}}" aria-label="{{t.aria}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">
<span style="{{t.nameStyle}}">{{t.name}}</span>
<sc-for list="{{t.clips}}" as="c" hint-placeholder-count="2">
<span style="{{c.style}}"></span>
</sc-for>
</button>
</sc-for>
<span aria-hidden="true" style="position: absolute; top: -4px; bottom: -4px; left: calc(36px + 34%); width: 2px; background: #3DD68C"></span>
<span aria-hidden="true" style="position: absolute; top: -8px; left: 36px; width: calc(50% - 18px); height: 4px; border-radius: 2px; background: #FFC23D"></span>
</div>
</div>
<div role="group" aria-label="Colour strips" style="width: 332px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{strips}}" as="s" hint-placeholder-count="4">
<button aria-label="{{s.aria}}" style="position: relative; overflow: hidden; border: 0; border-radius: 14px; background: #1C1C20; padding: 10px 6px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; font-family: 'Space Grotesk', system-ui, sans-serif">
<span style="{{s.fillStyle}}"></span>
<span style="{{s.labelStyle}}">{{s.label}}</span>
<span style="position: relative; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #FFFFFF">{{s.value}}</span>
</button>
</sc-for>
</div>
</div>

<div role="group" aria-label="Keyboard, two octaves" style="flex-grow: 1; position: relative">
<sc-for list="{{whiteKeys}}" as="k" hint-placeholder-count="15">
<button aria-label="{{k.name}}" style="{{k.style}}"><span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #5C5A55">{{k.label}}</span></button>
</sc-for>
<sc-for list="{{blackKeys}}" as="k" hint-placeholder-count="10">
<button aria-label="{{k.name}}" style="{{k.style}}"></button>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":480}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { shift: false, track: 1 };
  }
  renderVals() {
    const { shift, track } = this.state;
    const colours = ['#FF6B57', '#FFC23D', '#3DD68C', '#4F8BFF'];

    const base = [
      { label: 'Track', value: 'T' + (track + 1), pct: (track + 1) * 25 },
      { label: 'Loop', value: '1–8', pct: 50 },
      { label: 'Speed', value: '1.00×', pct: 50 },
      { label: 'Level', value: '−3dB', pct: 78 }
    ];
    const second = [
      { label: 'Pan', value: 'C', pct: 50 },
      { label: 'Fade', value: '20ms', pct: 18 },
      { label: 'Nudge', value: '0', pct: 50 },
      { label: 'Dub', value: '85%', pct: 85 }
    ];
    const strips = (shift ? second : base).map((s, i) => ({
      ...s,
      aria: s.label + ' ' + s.value + ', drag up or down',
      labelStyle: 'position: relative; font-size: 14px; font-weight: 700; color: ' + colours[i],
      fillStyle: 'position: absolute; left: 0; right: 0; bottom: 0; height: ' + s.pct + '%; background: ' + colours[i] + '38; border-top: 3px solid ' + colours[i]
    }));

    const clipSets = [
      [[0, 50], [50, 100]],
      [[0, 25], [25, 50], [50, 75]],
      [[12, 50]],
      [[50, 88]]
    ];
    const clipColours = ['#FF6B57', '#FFC23D', '#3DD68C', '#4F8BFF'];
    const tracks = clipSets.map((clips, t) => ({
      name: 'T' + (t + 1),
      aria: 'Track ' + (t + 1) + (t === track ? ', selected' : ''),
      pressed: t === track ? 'true' : 'false',
      pick: () => this.setState({ track: t }),
      style: 'position: relative; flex: 1; border-radius: 8px; border: 0; padding: 0; background: ' + (t === track ? '#2A2A30' : '#18181C') + (t === track ? '; outline: 1px solid #ECE9E2' : ''),
      nameStyle: 'position: absolute; left: 8px; top: 50%; transform: translateY(-50%); font-family: IBM Plex Mono, monospace; font-size: 12px; color: ' + (t === track ? '#ECE9E2' : '#7A7872'),
      clips: clips.map(([a, b]) => ({
        style: 'position: absolute; top: 5px; bottom: 5px; left: calc(36px + ' + a + '% * 0.94); width: calc(' + (b - a) + '% * 0.94 - 3px); border-radius: 5px; background: ' + clipColours[t] + '66; border-left: 3px solid ' + clipColours[t]
      }))
    }));

    const names = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
    const blackNames = { 0: 'C sharp', 1: 'D sharp', 3: 'F sharp', 4: 'G sharp', 5: 'A sharp' };
    const count = 15;
    const w = 100 / count;
    const whiteKeys = [];
    const blackKeys = [];
    for (let i = 0; i < count; i++) {
      const octave = 3 + Math.floor(i / 7);
      const name = names[i % 7] + octave;
      whiteKeys.push({
        name,
        label: i % 7 === 0 ? name : '',
        style: 'position: absolute; top: 0; bottom: 0; left: calc(' + (i * w) + '% + 2px); width: calc(' + w + '% - 4px); border: 0; border-radius: 0 0 10px 10px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px; background: #ECE9E2'
      });
      if (i < count - 1 && blackNames[i % 7]) {
        blackKeys.push({
          name: blackNames[i % 7] + ' ' + octave,
          style: 'position: absolute; top: 0; height: 58%; left: ' + ((i + 0.7) * w) + '%; width: ' + (0.6 * w) + '%; border: 0; border-radius: 0 0 8px 8px; background: #2A2A30'
        });
      }
    }

    return {
      strips,
      tracks,
      whiteKeys,
      blackKeys,
      layerLabel: shift ? 'SHIFT · track T' + (track + 1) : 'MAIN · loop and level',
      shiftPressed: shift ? 'true' : 'false',
      toggleShift: () => this.setState({ shift: !this.state.shift }),
      shiftStyle: 'min-width: 72px; height: 44px; border-radius: 10px; border: 0; font-family: Space Grotesk, system-ui, sans-serif; font-weight: 700; font-size: 14px; ' +
        (shift ? 'background: #FFC23D; color: #121214' : 'background: #1C1C20; color: #ECE9E2')
    };
  }
}
</script>
</body>
</html>
