<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Synth screen as built</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#ECE9E2}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 1040px; height: 480px; box-sizing: border-box; background: #121214; color: #ECE9E2; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 10px">

<div style="height: 48px; display: flex; align-items: center; gap: 10px">
<div style="display: flex; gap: 4px">
<span style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #ECE9E2; color: #121214; font-weight: 700; font-size: 14px">Synth</span>
<span style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; font-size: 14px">Drum</span>
<span style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; font-size: 14px">Seq</span>
<span style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; font-size: 14px">Tape</span>
<span style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; font-size: 14px">Mixer</span>
</div>
<div style="display: flex; gap: 4px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
<span style="{{s.style}}">{{s.n}}</span>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px">120.0 <span style="font-size: 12px; color: #A9A69F">BPM</span></span>
<span style="width: 48px; height: 44px; border-radius: 10px; background: #1C1C20; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><path d="M4 2.5v13l11-6.5z" fill="none" stroke="#3DD68C" stroke-width="2" stroke-linejoin="round"></path></svg></span>
<span style="width: 48px; height: 44px; border-radius: 10px; background: #1C1C20; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6" fill="none" stroke="#FF6B57" stroke-width="2"></circle></svg></span>
<span style="min-width: 72px; height: 44px; border-radius: 10px; background: #1C1C20; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">Shift</span>
</div>

<div style="height: 220px; display: flex; gap: 10px">
<div style="width: 64px; display: flex; flex-direction: column; gap: 6px">
<span style="flex: 1; border-radius: 10px; background: #ECE9E2; color: #121214; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">Osc</span>
<span style="flex: 1; border-radius: 10px; background: #1C1C20; display: flex; align-items: center; justify-content: center; font-size: 14px">Filter</span>
<span style="flex: 1; border-radius: 10px; background: #1C1C20; display: flex; align-items: center; justify-content: center; font-size: 14px">Env</span>
<span style="flex: 1; border-radius: 10px; background: #1C1C20; display: flex; align-items: center; justify-content: center; font-size: 14px">Mod</span>
</div>
<div role="img" aria-label="Synth display: saw wave, filter curve, envelope" style="flex-grow: 1; border-radius: 16px; background: #1C1C20; padding: 14px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: baseline; gap: 10px">
<span style="font-size: 20px; font-weight: 700">Brook</span>
<span style="font-size: 13px; color: #A9A69F">Rubber Floor · slot 2 · poly</span>
<span style="font-size: 13px; color: #FFC23D">A minor</span>
<div style="flex-grow: 1"></div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; color: #A9A69F">OSC · MAIN LAYER</span>
</div>
<svg aria-hidden="true" width="100%" height="130" viewBox="0 0 600 130" preserveAspectRatio="none">
<path d="M0 116 L80 14 L80 116 L160 14" fill="none" stroke="#FF6B57" stroke-width="3" stroke-linejoin="round"></path>
<path d="M200 50 L300 46 C320 46 330 20 340 26 L380 120 L400 120" fill="none" stroke="#FFC23D" stroke-width="2.5" opacity="0.7"></path>
<path d="M430 120 L445 10 C455 30 470 40 520 40 L540 40 C555 90 570 112 600 118" fill="none" stroke="#3DD68C" stroke-width="2.5" opacity="0.7"></path>
</svg>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; font-family: 'IBM Plex Mono', monospace; font-size: 13px">
<sc-for list="{{strips}}" as="s" hint-placeholder-count="4">
<span>{{s.label}} {{s.value}}</span>
</sc-for>
</div>
</div>
<div style="width: 332px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{strips}}" as="s" hint-placeholder-count="4">
<div style="position: relative; overflow: hidden; border-radius: 14px; background: #1C1C20; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="{{s.fillStyle}}"></span>
<span style="{{s.labelStyle}}">{{s.label}}</span>
<span style="position: relative; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #FFFFFF">{{s.value}}</span>
</div>
</sc-for>
</div>
</div>

<div role="img" aria-label="Capsule keyboard, two octaves, A minor: out-of-key pads dimmed, A pads accented" style="flex-grow: 1; position: relative; border-radius: 18px; background: #0C0C0E">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="25">
<span style="{{k.pad}}"><span style="{{k.stripe}}"></span></span>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const colours = ['#FF6B57', '#FFC23D', '#3DD68C', '#4F8BFF'];
    const strips = [
      { label: 'Wave', value: 'Saw', pct: 2 },
      { label: 'PW', value: '50%', pct: 50 },
      { label: 'Sub', value: '0%', pct: 1 },
      { label: 'Noise', value: '0%', pct: 1 }
    ].map((s, i) => ({
      ...s,
      labelStyle: 'position: relative; font-size: 14px; font-weight: 700; color: ' + colours[i],
      fillStyle: 'position: absolute; left: 0; right: 0; bottom: 0; height: ' + s.pct + '%; background: ' + colours[i] + '38; border-top: 3px solid ' + colours[i]
    }));
    const slots = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => ({
      n,
      style: 'width: 38px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: IBM Plex Mono, monospace; font-size: 14px; ' +
        (n === 2 ? 'background: #FF6B57; color: #121214' : 'background: #1C1C20; color: #A9A69F')
    }));
    // Capsule keyboard: 15 natural slots, pads 56% of a slot wide, sharps row on top.
    const inKey = new Set([9, 11, 0, 2, 4, 5, 7]); // A minor pitch classes
    const names = [0, 2, 4, 5, 7, 9, 11];
    const w = 100 / 15;
    const pw = w * 0.56;
    const keys = [];
    const pad = (cx, top, bottom, pc) => {
      const on = inKey.has(pc);
      const root = pc === 9;
      return {
        pad: 'position: absolute; left: calc(' + (cx - pw / 2) + '% + 0px); width: ' + pw + '%; top: ' + top + '%; height: ' + (bottom - top) + '%; border-radius: 999px; background: ' + (on ? '#2B2B31' : '#18181B') + '; display: flex; justify-content: center; align-items: center',
        stripe: 'width: 12%; height: 45%; border-radius: 4px; background: ' + (root ? '#FFC23D' : (on ? '#ECE9E2' : '#3A3A40'))
      };
    };
    for (let i = 0; i < 15; i++) {
      const pc = names[i % 7];
      keys.push(pad((i + 0.5) * w, 52, 92, pc));
      if (i < 14 && [0, 1, 3, 4, 5].includes(i % 7)) keys.push(pad((i + 1) * w, 6, 46, (pc + 1) % 12));
    }
    return { strips, slots, keys };
  }
}
</script>
</body>
</html>
