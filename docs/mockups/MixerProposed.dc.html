<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mixer screen proposed</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Space+Grotesk:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1040px; height: 480px; box-sizing: border-box; background: #121214; color: #ECE9E2; font-family: 'Space Grotesk', system-ui, sans-serif; padding: 10px 14px 12px; display: flex; flex-direction: column; gap: 10px">

<div style="height: 48px; display: flex; align-items: center; gap: 10px">
<div style="display: flex; gap: 4px">
<span style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; font-size: 14px">Synth</span>
<span style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; font-size: 14px">Drum</span>
<span style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; font-size: 14px">Seq</span>
<span style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #1C1C20; font-size: 14px">Tape</span>
<span style="min-width: 60px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #ECE9E2; color: #121214; font-weight: 700; font-size: 14px">Mixer</span>
</div>
<div style="display: flex; gap: 4px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="8">
<span style="{{s.style}}">{{s.n}}</span>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 22px">120.0 <span style="font-size: 12px; color: #A9A69F">BPM</span></span>
<span style="width: 48px; height: 44px; border-radius: 10px; background: #3DD68C; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="#121214"></rect></svg></span>
<span style="width: 48px; height: 44px; border-radius: 10px; background: #1C1C20; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 18 18"><circle cx="9" cy="9" r="6" fill="none" stroke="#FF6B57" stroke-width="2"></circle></svg></span>
<span style="min-width: 72px; height: 44px; border-radius: 10px; background: #1C1C20; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">Shift</span>
</div>

<div style="height: 220px; display: flex; gap: 10px">
<div style="flex-grow: 1; border-radius: 16px; background: #1C1C20; padding: 12px 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; min-width: 0">
<div style="display: flex; align-items: baseline; gap: 10px; min-width: 0">
<span style="font-size: 20px; font-weight: 700; white-space: nowrap">Mixer</span>
<span style="font-size: 13px; color: #A9A69F; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">slot 2 · Rubber Floor · solo on</span>
<div style="flex-grow: 1"></div>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A9A69F; white-space: nowrap">MAIN · channel 2</span>
</div>
<div role="img" aria-label="Level columns for slots 1 to 8, tape tracks T1 to T4, delay, reverb and master: a live meter, a white fader line and a clip light each. Channel 2 is selected and soloed, so other slots are silent; slot 4 is muted; the master carries the performance effects" style="flex-grow: 1; display: flex; gap: 4px; min-height: 0">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="15">
<div style="{{c.box}}">
<span style="{{c.valueStyle}}">{{c.value}}</span>
<div style="position: relative; flex-grow: 1; width: 55%; border-radius: 4px; background: #121214; overflow: hidden">
<span style="{{c.meterStyle}}"></span>
<span style="{{c.faderStyle}}"></span>
<span style="{{c.clipStyle}}"></span>
</div>
<span style="{{c.nameStyle}}">{{c.name}}</span>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 6px; min-width: 0">
<span style="height: 30px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; font-size: 13px; font-weight: 700; background: #2B2B31; color: #ECE9E2">Mute</span>
<span style="height: 30px; padding: 0 12px; border-radius: 8px; display: flex; align-items: center; font-size: 13px; font-weight: 700; background: #2A2618; color: #FFC23D; box-shadow: inset 0 0 0 1.5px #FFC23D">Solo</span>
<span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #A9A69F; margin-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0">S solo · M mute · line = fader · red = clip · FX on MST</span>
</div>
</div>

<div style="width: 332px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{strips}}" as="s" hint-placeholder-count="4">
<div style="{{s.box}}">
<span style="{{s.fillStyle}}"></span>
<span style="{{s.labelStyle}}">{{s.label}}</span>
<span style="position: relative; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #FFFFFF; white-space: nowrap">{{s.value}}</span>
</div>
</sc-for>
</div>
</div>

<div role="img" aria-label="15 channel pads with one label style: channel name in mono, a small sub-label below; pad 2 selected and soloed, pad 4 muted" style="flex-grow: 1; display: flex; gap: 5px">
<sc-for list="{{pads}}" as="p" hint-placeholder-count="15">
<div style="{{p.style}}">
<span style="{{p.nameStyle}}">{{p.name}}</span>
<div style="flex-grow: 1"></div>
<span style="{{p.subStyle}}">{{p.sub}}</span>
<span style="{{p.tickStyle}}"></span>
<span style="{{p.badgeStyle}}">{{p.badge}}</span>
</div>
</sc-for>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1040,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const mono = 'font-family: IBM Plex Mono, monospace; ';
    const slots = [1, 2, 3, 4, 5, 6, 7, 8].map((n) => ({
      n,
      style: 'width: 38px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; ' + mono + 'font-size: 14px; ' +
        (n === 2 ? 'background: #FF6B57; color: #121214' : 'background: #1C1C20; color: #A9A69F')
    }));
    const colours = ['#FF6B57', '#FFC23D', '#3DD68C', '#4F8BFF'];
    const strips = [
      { label: 'Volume', value: '0 dB', pct: 75 },
      { label: 'Pan', value: 'C', pct: 50 },
      { label: 'Delay', value: '20%', pct: 20 },
      { label: 'Reverb', value: '35%', pct: 35 }
    ].map((s, i) => ({
      ...s,
      box: 'position: relative; overflow: hidden; border-radius: 14px; background: #1C1C20; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px',
      labelStyle: 'position: relative; font-size: 14px; font-weight: 700; color: ' + colours[i],
      fillStyle: 'position: absolute; left: 0; right: 0; bottom: 0; height: ' + Math.min(s.pct, 76) + '%; background: ' + colours[i] + '38; border-top: 3px solid ' + colours[i]
    }));
    // name, sub, kind colour, fader (0..1), meter (0..1), value, muted, clip, kind
    // Slot 2 is soloed, so the other slots (1-8) read silent; tape, returns and master still move.
    const chans = [
      ['1', 'Kit', '#FF6B57', 0.75, 0, '-3', false, false, 'slot'],
      ['2', 'Rubber Floor', '#FF6B57', 0.75, 0.66, '0', false, false, 'slot'],
      ['3', 'Brook', '#FF6B57', 0.7, 0, '-6', false, false, 'slot'],
      ['4', 'Glass Wire', '#FF6B57', 0.7, 0, '-6', true, false, 'slot'],
      ['5', 'Empty', '#FF6B57', 0.7, 0, '-6', false, false, 'slot'],
      ['6', 'Empty', '#FF6B57', 0.7, 0, '-6', false, false, 'slot'],
      ['7', 'Empty', '#FF6B57', 0.7, 0, '-6', false, false, 'slot'],
      ['8', 'Empty', '#FF6B57', 0.7, 0, '-6', false, false, 'slot'],
      ['T1', 'tape', '#FFC23D', 0.7, 0.44, '-6', false, false, 'tape'],
      ['T2', 'tape', '#FFC23D', 0.7, 0.3, '-6', false, false, 'tape'],
      ['T3', 'tape', '#FFC23D', 0.7, 0, '-6', false, false, 'tape'],
      ['T4', 'tape', '#FFC23D', 0.7, 0, '-6', false, false, 'tape'],
      ['DLY', 'delay', '#3DD68C', 0.6, 0.22, '-9', false, false, 'ret'],
      ['REV', 'reverb', '#4F8BFF', 0.6, 0.3, '-9', false, false, 'ret'],
      ['MST', 'master · FX', '#ECE9E2', 0.8, 0.97, '-2', false, true, 'mst']
    ];
    const selected = 1;
    const soloed = 1;
    const cols = chans.map(([name, sub, col, fader, meter, value, muted, clip, kind], i) => {
      const sel = i === selected;
      const silent = kind === 'slot' && i !== soloed && !muted;
      const fx = kind === 'mst';
      return {
        name,
        value: muted ? 'M' : i === soloed ? 'S' : fx ? 'FX' : value,
        box: 'flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; border-radius: 8px; padding: 3px 0; box-sizing: border-box' +
          (sel ? '; background: #26262B' : fx ? '; box-shadow: inset 0 0 0 1px #ECE9E2' : '') + (muted ? '; opacity: 0.45' : silent ? '; opacity: 0.6' : ''),
        valueStyle: mono + 'font-size: 10px; line-height: 14px; height: 14px; padding: 0 3px; border-radius: 4px; white-space: nowrap; ' +
          (muted ? 'background: #FF6B57; color: #121214; font-weight: 500' : i === soloed ? 'background: #FFC23D; color: #121214; font-weight: 500' : fx ? 'background: #ECE9E2; color: #121214; font-weight: 500' : 'color: #A9A69F'),
        nameStyle: mono + 'font-size: 10px; line-height: 1; white-space: nowrap; color: ' + (sel ? '#ECE9E2; font-weight: 500' : '#7C7A75'),
        meterStyle: 'position: absolute; left: 0; right: 0; bottom: 0; height: ' + (meter * 100) + '%; background: ' + col + '; opacity: 0.85',
        faderStyle: 'position: absolute; left: 0; right: 0; bottom: ' + (fader * 100) + '%; height: 2px; background: #ECE9E2',
        clipStyle: clip ? 'position: absolute; left: 0; right: 0; top: 0; height: 5px; background: #FF3B30' : 'display: none'
      };
    });
    const pads = chans.map(([name, sub, col, , , , muted], i) => {
      const sel = i === selected;
      const solo = i === soloed;
      return {
        name,
        sub,
        badge: muted ? 'M' : solo ? 'S' : '',
        style: 'position: relative; flex: 1; min-width: 0; border-radius: 12px; padding: 7px 6px 6px; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: ' + (sel ? '#ECE9E2' : '#1C1C20') + '; border: 1px solid ' + (sel ? '#ECE9E2' : '#2B2B31') + (muted ? '; opacity: 0.45' : ''),
        nameStyle: mono + 'font-size: 13px; font-weight: 500; line-height: 1; white-space: nowrap; color: ' + (sel ? '#121214' : '#ECE9E2'),
        subStyle: 'font-size: 10px; line-height: 1.15; max-height: 2.3em; overflow: hidden; color: ' + (sel ? '#121214' : '#7C7A75'),
        tickStyle: 'margin-top: 4px; height: 3px; flex-shrink: 0; border-radius: 2px; background: ' + col + '; opacity: ' + (sel ? 0.9 : 0.5),
        badgeStyle: (muted || solo) ? 'position: absolute; top: 5px; right: 5px; padding: 0 4px; border-radius: 4px; ' + mono + 'font-size: 11px; font-weight: 500; line-height: 15px; color: #121214; background: ' + (muted ? '#FF6B57' : '#FFC23D') : 'display: none'
      };
    });
    return { slots, strips, cols, pads };
  }
}
</script>
</body>
</html>
